name: "Altru Coder GitHub Action"
description: "Run Altru Coder AI agent in GitHub Actions workflows"
branding:
  icon: "code"
  color: "gray-dark"

inputs:
  model:
    description: "Model to use"
    required: true

  agent:
    description: "Agent to use. Must be a primary agent. Falls back to default_agent from config or 'build' if not found."
    required: false

  share:
    description: "Share the Altru Coder session (defaults to true for public repos)"
    required: false

  prompt:
    description: "Custom prompt to override the default prompt"
    required: false

  use_github_token:
    description: "Use GITHUB_TOKEN directly instead of Altru Coder App token exchange. When true, skips OIDC and uses the GITHUB_TOKEN env var."
    required: false
    default: "false"

  mentions:
    description: "Comma-separated list of trigger phrases (case-insensitive). Defaults to '/altru,/kc'"
    required: false

  variant:
    description: "Model variant for provider-specific reasoning effort (e.g., high, max, minimal)"
    required: false

  oidc_base_url:
    description: "Base URL for OIDC token exchange API. Only required when running a custom GitHub App install. Defaults to https://api.altru-coder.ai"
    required: false

  altru_coder_api_key:
    description: "Altru Coder API key for gateway authentication"
    required: false

  altru_coder_org_id:
    description: "Altru Coder organization ID"
    required: false

runs:
  using: "composite"
  steps:
    - name: Get Altru Coder version
      id: version
      shell: bash
      run: |
        VERSION=$(curl -sf https://api.github.com/repos/Altru-Coder/altrucoder/releases/latest | grep -o '"tag_name": *"[^"]*"' | cut -d'"' -f4)
        echo "version=${VERSION:-latest}" >> $GITHUB_OUTPUT

    - name: Cache Altru Coder
      id: cache
      uses: actions/cache@v4
      with:
        path: ~/.altru-coder/bin
        key: altru-coder-${{ runner.os }}-${{ runner.arch }}-${{ steps.version.outputs.version }}

    - name: Install Altru Coder
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: curl -fsSL https://altru-coder.ai/cli/install | bash

    - name: Add Altru Coder to PATH
      shell: bash
      run: echo "$HOME/.altru-coder/bin" >> $GITHUB_PATH

    - name: Run Altru Coder
      shell: bash
      id: run_altru_coder
      run: altru-coder github run
      env:
        MODEL: ${{ inputs.model }}
        AGENT: ${{ inputs.agent }}
        SHARE: ${{ inputs.share }}
        PROMPT: ${{ inputs.prompt }}
        USE_GITHUB_TOKEN: ${{ inputs.use_github_token }}
        MENTIONS: ${{ inputs.mentions }}
        VARIANT: ${{ inputs.variant }}
        OIDC_BASE_URL: ${{ inputs.oidc_base_url }}
        ALTRU_CODER_API_KEY: ${{ inputs.altru-coder_api_key }}
        ALTRU_CODER_ORG_ID: ${{ inputs.altru-coder_org_id }}
