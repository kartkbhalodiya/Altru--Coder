name: triage

on:
  issues:
    types: [opened]

jobs:
  triage:
    if: github.repository == 'Altru-Coder/altrucoder'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6 # altrucoder_change
        with:
          fetch-depth: 1

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Setup Altru Coder
        uses: ./.github/actions/setup-altru-coder

      - name: Triage issue
        env:
          ALTRU_CODER_API_KEY: ${{ secrets.ALTRU_CODER_API_KEY }}
          ALTRU_CODER_ORG_ID: ${{ secrets.ALTRU_CODER_ORG_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          altru-coder run --agent triage "The following issue was just opened, triage it:

          Title: $ISSUE_TITLE

          $ISSUE_BODY"
